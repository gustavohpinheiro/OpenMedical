[package]
name = "openclinical_desktop"
version = "0.1.0"
edition = "2021"
authors = ["OpenClinical Core Team"]
description = "Aplicativo Desktop e Mobile Multiplataforma para OpenClinical via Tauri 2.0"

[dependencies]
clinical_engine = { path = "../clinical_engine" }
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Credenciais do Portal de APIs da ANVISA no cofre do sistema (Gerenciador de Credenciais / Keychain / Secret Service)
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
