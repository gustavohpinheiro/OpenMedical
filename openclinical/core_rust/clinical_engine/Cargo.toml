[package]
name = "clinical_engine"
version = "0.1.0"
edition = "2021"
authors = ["OpenClinical Core Team"]
description = "Motor clínico determinístico e motor de busca médica para OpenClinical"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
# Atualizador diário dos dados abertos da ANVISA (preços CMED, registros e índice de bulas)
ureq = "2.12"
csv = "1.3"
encoding_rs = "0.8"

[dev-dependencies]
serde_json = "1.0"
