[project]
name = "openclinical-etl"
version = "0.1.0"
description = "Pipeline de Engenharia de Dados e NLP para OpenClinical"
authors = [{ name = "OpenClinical Core Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
