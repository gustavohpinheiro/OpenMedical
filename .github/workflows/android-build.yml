name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: openclinical/frontend_ui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: openclinical/frontend_ui
        run: npm ci

      - name: Build Frontend Assets
        working-directory: openclinical/frontend_ui
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Android APK
        working-directory: openclinical/core_rust/openclinical_desktop
        run: cargo tauri android build --apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclinical-android-apk
          path: openclinical/core_rust/openclinical_desktop/gen/android/app/build/outputs/apk/**/*.apk
